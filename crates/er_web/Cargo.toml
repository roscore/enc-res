[package]
name = "er_web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Browser UI for Enc Res"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
er_core = { path = "../er_core" }
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "Event", "MouseEvent", "KeyboardEvent",
  "EventTarget", "Node", "NodeList", "DomTokenList", "Blob", "BlobPropertyBag",
  "Url", "HtmlAnchorElement", "CssStyleDeclaration", "TextMetrics",
]
